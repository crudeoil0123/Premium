<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCX Commodity Signals</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:#f5f7fa;
color:#222;

}

/* hero */

.hero{

height:100vh;

background:url("bg.jpg") center/cover no-repeat;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

color:white;

position:relative;

}

.hero::before{

content:"";

position:absolute;

width:100%;
height:100%;

background:rgba(0,0,0,0.6);

}

.hero-content{

position:relative;

z-index:2;

animation:fade 1.5s ease;

}

.hero h1{

font-size:50px;

margin-bottom:15px;

}

.hero p{

font-size:20px;

margin-bottom:25px;

}

/* button */

.join{

background:#00c853;

padding:16px 40px;

font-size:22px;

border-radius:40px;

text-decoration:none;

color:white;

transition:0.3s;

}

.join:hover{

background:#00a944;

}

/* stats */

.stats{

display:flex;

justify-content:center;

gap:60px;

padding:60px;

background:white;

}

.stats div{

text-align:center;

font-size:22px;

}

/* profits */

.profit{

padding:70px 20px;

text-align:center;

}

.profit h2{

font-size:32px;

margin-bottom:40px;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:25px;

max-width:1000px;

margin:auto;

}

.grid img{

width:100%;

border-radius:12px;

box-shadow:0 10px 20px rgba(0,0,0,0.15);

transition:0.3s;

}

.grid img:hover{

transform:scale(1.05);

}

/* footer */

footer{

background:#111;

color:#aaa;

padding:20px;

text-align:center;

}

@keyframes fade{

from{opacity:0;transform:translateY(30px)}

to{opacity:1;transform:translateY(0)}

}

</style>

</head>

<body>

<section class="hero">

<div class="hero-content">

<h1>MCX Commodity Jackpot Signals</h1>

<p>Crude Oil • Gold • Silver • Natural Gas</p>

<a href="https://t.me/YOURTELEGRAM" class="join">

Join Telegram Free

</a>

</div>

</section>

<section class="stats">

<div>

<h2>12K+</h2>

<p>Members</p>

</div>

<div>

<h2>95%</h2>

<p>Accuracy</p>

</div>

<div>

<h2>5+</h2>

<p>Years Experience</p>

</div>

</section>

<section class="profit">

<h2>Recent Profit Updates</h2>

<div class="grid">

<img src="profit1.jpg">

<img src="profit2.jpg">

<img src="profit3.jpg">

<img src="profit4.jpg">

</div>

</section>

<footer>

Disclaimer: We are not SEBI registered. Signals are for educational purposes only.

</footer>

</body>

</html>
